name: Daily swing scan

on:
  schedule:
    - cron: "47 11 * * 1-5"   # 17:17 IST, Monday-Friday (after NSE close + data settles)
  workflow_dispatch: {}        # lets you run it manually from the Actions tab

permissions:
  contents: write

concurrency:
  group: scan
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Run scan
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          PAGE_URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/
        run: python run_daily.py

      - name: Publish report
        run: |
          git config user.name "swing-bot"
          git config user.email "swing-bot@users.noreply.github.com"
          git add docs
          git diff --cached --quiet || git commit -m "Scan $(date -u +%F)"
          git push
